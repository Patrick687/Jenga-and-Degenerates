name: Deploy to DigitalOcean

on:
  push:
    branches:
      - main
  workflow_dispatch:

# One deploy at a time, and never cancel one that is mid-upload.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: backend

      - name: Run backend tests
        run: npm test
        working-directory: backend

      - name: Build
        run: npm run build
        env:
          # Baked into the build so the QR code points at the real domain.
          VITE_PUBLIC_APP_URL: https://jenga.codewithpatrick.dev

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: 'placeholder'

      - name: Add known hosts
        run: ssh-keyscan -H ${{ secrets.DROPLET_IP }} >> ~/.ssh/known_hosts

      - name: Test SSH connection
        run: ssh ${{ secrets.DROPLET_USERNAME }}@${{ secrets.DROPLET_IP }} "echo 'SSH connection successful!'"

      # Backend first, so the API (and its migrations) is ready before the new site goes live.
      - name: Upload backend source
        run: |
          rsync -az --delete \
            --exclude node_modules --exclude dist --exclude data \
            --exclude .env --exclude 'src/generated' \
            backend/ \
            ${{ secrets.DROPLET_USERNAME }}@${{ secrets.DROPLET_IP }}:/var/www/jenga-api/

      - name: Install, migrate and restart backend
        run: ssh ${{ secrets.DROPLET_USERNAME }}@${{ secrets.DROPLET_IP }} 'bash -s' < deploy/deploy-backend.sh

      - name: Deploy frontend with rsync
        run: |
          rsync -avz --delete \
            dist/ \
            ${{ secrets.DROPLET_USERNAME }}@${{ secrets.DROPLET_IP }}:/var/www/jenga/
