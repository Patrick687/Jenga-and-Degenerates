# One-time server setup. Copy to /etc/nginx/sites-available/assassin on the droplet.
# It serves the same site build as Jenga (/var/www/jenga) and sends the bare address
# to the Assassin game. Certbot adds the HTTPS (listen 443) parts for you.
server {
  listen 80;
  server_name assassin.codewithpatrick.dev;

  root /var/www/jenga;
  index index.html;

  # GraphQL API (see deploy/nginx-jenga-api.conf).
  include snippets/jenga-api.conf;

  location = / {
    return 302 /assassin;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
