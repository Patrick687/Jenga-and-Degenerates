# One-time server setup. Copy to /etc/nginx/sites-available/jenga on the droplet.
# Certbot adds the HTTPS (listen 443) parts for you.
server {
  listen 80;
  server_name jenga.codewithpatrick.dev;

  root /var/www/jenga;
  index index.html;

  # Hashed build assets can be cached forever; index.html must always be fresh.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
